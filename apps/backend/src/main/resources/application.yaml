spring:
  application:
    name: sdg16-backend
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  ml-service:
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
    connect-timeout: ${ML_CONNECT_TIMEOUT:5s}
    read-timeout: ${ML_READ_TIMEOUT:120s}
